<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tracking Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            padding: 0;
            overflow: hidden;
        }
        
        .container {
            max-width: 100vw;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #1a1a1a;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #00ff00;
        }
        
        h1 {
            margin: 0;
            font-size: 1.2em;
            color: #00ff00;
        }
        
        .target-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .target-selector label {
            font-size: 0.9em;
            color: #888;
        }
        
        #class-select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #00ff00;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.9em;
            cursor: pointer;
        }
        
        #class-select:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        
        .video-container {
            background: #000;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .status-panel {
            background: #1a1a1a;
            padding: 8px 10px;
            border-top: 2px solid #00ff00;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .status-item {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }
        
        .status-label {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 3px;
        }
        
        .status-value {
            font-size: 1.1em;
            font-weight: bold;
        }
        
        #target-text {
            font-size: 0.9em;
        }
        
        .detected {
            color: #00ff00;
        }
        
        .not-detected {
            color: #ff0000;
        }
        
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        .indicator.active {
            background: #00ff00;
        }
        
        .indicator.inactive {
            background: #ff0000;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Tracking Camera</h1>
            <div class="target-selector">
                <label for="class-select">Target:</label>
                <select id="class-select">
                    <option value="">Loading...</option>
                </select>
            </div>
        </div>
        
        <div class="video-container">
            <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Video Stream">
        </div>
        
        <div class="status-panel">
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Target Status</div>
                    <div class="status-value" id="target-status">
                        <span class="indicator inactive"></span>
                        <span id="target-text">Searching...</span>
                    </div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">Pan Angle</div>
                    <div class="status-value" id="pan-value">90.0°</div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">Tilt Angle</div>
                    <div class="status-value" id="tilt-value">90.0°</div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">FPS</div>
                    <div class="status-value" id="fps-value">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTargetClass = null;
        
        // Load COCO classes into dropdown
        function loadClasses() {
            fetch('/classes')
                .then(response => response.json())
                .then(classes => {
                    const select = document.getElementById('class-select');
                    select.innerHTML = '';
                    
                    // Sort classes by name
                    const sortedClasses = Object.entries(classes).sort((a, b) => 
                        a[1].localeCompare(b[1])
                    );
                    
                    sortedClasses.forEach(([id, name]) => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = name.charAt(0).toUpperCase() + name.slice(1);
                        select.appendChild(option);
                    });
                    
                    // Set current target
                    if (currentTargetClass !== null) {
                        select.value = currentTargetClass;
                    }
                })
                .catch(error => console.error('Error loading classes:', error));
        }
        
        // Handle target class change
        document.getElementById('class-select').addEventListener('change', function() {
            const classId = parseInt(this.value);
            fetch(`/set_target/${classId}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        console.log('Target changed to:', data.class_name);
                    }
                })
                .catch(error => console.error('Error setting target:', error));
        });
        
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const indicator = document.querySelector('.indicator');
                    const targetText = document.getElementById('target-text');
                    
                    if (data.target_detected) {
                        indicator.className = 'indicator active';
                        targetText.textContent = 'Detected';
                        targetText.className = 'detected';
                    } else {
                        indicator.className = 'indicator inactive';
                        targetText.textContent = 'Searching...';
                        targetText.className = 'not-detected';
                    }
                    
                    document.getElementById('pan-value').textContent = data.pan + '°';
                    document.getElementById('tilt-value').textContent = data.tilt + '°';
                    document.getElementById('fps-value').textContent = data.fps;
                    
                    // Update dropdown if target class changed from backend
                    if (data.target_class !== currentTargetClass) {
                        currentTargetClass = data.target_class;
                        document.getElementById('class-select').value = currentTargetClass;
                    }
                })
                .catch(error => console.error('Error fetching status:', error));
        }
        
        // Initialize
        loadClasses();
        setInterval(updateStatus, 500);
        updateStatus();
    </script>
</body>
</html>
